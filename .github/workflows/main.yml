
name: Build Nontina APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: build-nontina-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Installer Android
        uses: android-actions/setup-android@v3

      - name: Accepter les licences Android
        run: yes | sdkmanager --licenses

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Donner les permissions Gradle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Compiler APK debug
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERREUR : le fichier gradlew est introuvable."
            echo "Le projet Android Gradle est peut-etre incomplet."
            exit 1
          fi

      - name: Verifier le fichier APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Nontina-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
